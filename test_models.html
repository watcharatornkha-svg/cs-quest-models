<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>ทดสอบโหลดโมเดลจาก GCS</title>
<style>body{font-family:"Segoe UI","Noto Sans Thai",sans-serif;padding:24px;max-width:720px;margin:auto}input{width:100%;padding:8px;font-size:14px}button{padding:8px 16px;margin-top:8px}li{margin:3px 0}.ok{color:#059669}.bad{color:#dc2626}</style></head>
<body><h2>ทดสอบว่าเบราว์เซอร์โหลดโมเดลจาก bucket ได้มั้ย</h2>
<p>วาง URL ฐานของโฟลเดอร์ models (เช่น <code>https://storage.googleapis.com/ชื่อ-bucket/models</code>) แล้วกดทดสอบ — ต้องขึ้น ✅ ครบ 35 ไฟล์ ถ้าขึ้น CORS หรือ 403 ดูท้ายคู่มือ</p>
<input id="u" placeholder="https://storage.googleapis.com/.../models"><button onclick="run()">ทดสอบ</button><ul id="o"></ul>
<script>
const F=["block_WoodPlanks.gltf","block_Brick.gltf","block_Grass.gltf","block_Ice.gltf","block_Crystal.gltf","block_GreyBricks.gltf","block_Snow.gltf","block_Cheese.gltf","block_Stone.gltf","decor_Chest_Closed.gltf","decor_Crystal_Big.gltf","decor_Plant_2.gltf","decor_Flowers_1.gltf","decor_Tree_1.gltf","decor_Door_Closed.gltf","decor_Mushroom.gltf","decor_Bush.gltf","decor_Crystal_Small.gltf","decor_Rock1.gltf","tool_Sword_Diamond.gltf","tool_Pickaxe_Gold.gltf","tool_Axe_Wood.gltf","tool_Shovel_Stone.gltf","char_Character_Male_1.gltf","char_Character_Female_1.gltf","char_Character_Male_2.gltf","char_Character_Female_2.gltf","pet_cat.glb","pet_dog.glb","pet_bunny.glb","pet_penguin.glb","pet_fox.glb","pet_panda.glb","pet_chick.glb","pet_koala.glb"];
async function run(){const base=document.getElementById('u').value.replace(/\/$/,'');const o=document.getElementById('o');o.innerHTML='';let ok=0;
for(const f of F){const li=document.createElement('li');o.appendChild(li);try{const r=await fetch(base+'/'+f);if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.arrayBuffer();li.className='ok';li.textContent='✅ '+f+' ('+Math.round(b.byteLength/1024)+' KB)';ok++}catch(e){li.className='bad';li.textContent='❌ '+f+' — '+e.message+(e.message==='Failed to fetch'?' (น่าจะ CORS หรือ bucket ไม่ public)':'')}}
o.insertAdjacentHTML('afterbegin','<li><b>'+ok+'/'+F.length+' ไฟล์</b></li>')}
</script></body></html>
